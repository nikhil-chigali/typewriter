<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: file:; style-src 'self' file:; script-src 'self' file:; font-src 'self' file:" />
<title>Typewriter</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">

  <!-- paper: clipped so it can print upward out of the slot -->
  <div id="paper-clip">
    <div id="paper" class="hidden">
      <div id="paper-title" class="paper-title"></div>
      <div id="paper-divider" class="paper-divider"></div>
      <div id="paper-body" class="paper-body"></div>
      <div id="all-done" class="all-done">ALL DONE &#10003;</div>
    </div>
  </div>

  <div id="typewriter">

    <div class="tw-top">
      <div class="roller"></div>
      <div class="slot"></div>
    </div>

    <div class="tw-body">

      <div class="status">
        <span class="plus">+</span>
        <span id="counter">0/0 done</span>
        <span class="plus">+</span>
        <button id="view-toggle" type="button" title="Show full list">&#8801;</button>
        <button id="sound-toggle" type="button" title="Sound on">&#9834;</button>
      </div>

      <div id="idle">
        <div class="idle-main">type your plan...<span class="caret">|</span></div>
        <div id="idle-sub" class="idle-sub">drag &amp; drop a .md file or paste (&#8984;V)</div>
      </div>

      <div id="keys" class="keys"></div>

    </div>
  </div>
</div>

<div id="fx"></div>
<div id="toast" class="hidden"></div>

<div id="modal" class="hidden">
  <div class="dialog">
    <div id="dialog-title" class="dialog-title"></div>
    <div id="dialog-text" class="dialog-text"></div>
    <textarea id="note" class="note hidden" rows="3"
              placeholder="what did you learn? what was hard?"></textarea>
    <div id="dialog-actions" class="dialog-actions"></div>
  </div>
</div>

<script src="audio.js"></script>
<script src="fx.js"></script>
<script src="app.js"></script>
</body>
</html>
